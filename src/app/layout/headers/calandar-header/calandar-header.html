<header
    class="flex h-20 items-center justify-between bg-white px-8 sticky top-0 z-30 shadow-sm border-b border-slate-100">
    <div class="flex items-center gap-4">
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Agent Calendar</h2>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2">
            <button class="p-1.5 hover:bg-slate-50 rounded-lg text-slate-500 transition-colors">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <span class="text-sm font-bold text-slate-700 w-32 text-center">October 2023</span>
            <button class="p-1.5 hover:bg-slate-50 rounded-lg text-slate-500 transition-colors">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <div class="flex bg-slate-100 p-1 rounded-xl">
            <button class="px-4 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-primary">Month</button>
            <button
                class="px-4 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">Week</button>
            <button
                class="px-4 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">Day</button>
        </div>
        <button
            class="bg-primary hover:bg-primary-hover text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-glow flex items-center gap-2">
            <span class="material-symbols-outlined text-[20px]">add</span>
            New Event
        </button>
    </div>
</header>
