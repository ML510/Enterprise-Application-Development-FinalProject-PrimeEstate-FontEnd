<header
    class="flex h-20 items-center justify-between bg-white px-8 sticky top-0 z-30 shadow-sm border-b border-slate-100">
    <div>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Property Listings</h2>
        <div class="flex items-center gap-2 text-xs text-slate-500 font-medium mt-0.5">
            <span>Manage your premium portfolio in Dubai</span>
        </div>
    </div>
    <div class="flex items-center gap-6">
        <div class="hidden md:flex relative group">
            <span class="absolute left-3 top-2.5 text-slate-400 material-symbols-outlined text-[20px]">search</span>
            <input
                class="h-10 w-64 rounded-full border border-slate-200 bg-slate-50 pl-10 pr-4 text-sm text-slate-700 focus:bg-white focus:border-primary focus:ring-0 transition-all placeholder-slate-400"
                placeholder="Quick search..." type="text" />
        </div>
        <button
            (click)="openCreatePropertyModal()"
            class="bg-primary hover:bg-primary-hover text-white text-sm font-bold px-6 py-2.5 rounded-full shadow-glow transition-all flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">add</span>
            Add Listing
        </button>
        <div class="h-8 w-px bg-slate-200 mx-1"></div>
        <app-alert-popup></app-alert-popup>
    </div>
</header>

@if (showCreatePropertyModal()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-lg">
        <div class="sticky top-0 flex items-center justify-between border-b border-slate-100 bg-white px-6 py-4">
            <h2 class="text-lg font-bold text-slate-900">Add New Property</h2>
            <button 
                (click)="closeCreatePropertyModal()"
                class="text-slate-500 hover:text-slate-700">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>
        <div class="p-6">
            <app-create-property 
                [asModal]="true"
                (closed)="closeCreatePropertyModal()"
                (saved)="onPropertySaved()">
            </app-create-property>
        </div>
    </div>
</div>
}
