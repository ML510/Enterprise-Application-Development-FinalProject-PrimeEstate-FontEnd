<header
    class="flex h-20 items-center justify-between bg-white px-8 sticky top-0 z-30 shadow-sm border-b border-slate-100">
    <div>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Lead Management</h2>
        <p class="text-xs text-slate-500 font-medium mt-0.5">Manage your high-net-worth client pipeline</p>
    </div>
    <div class="flex items-center gap-6">
        <div class="hidden md:flex relative group">
            <span class="absolute left-3 top-2.5 text-slate-400 material-symbols-outlined text-[20px]">search</span>
            <input
                class="h-10 w-80 rounded-full border border-slate-200 bg-slate-50 pl-10 pr-4 text-sm text-slate-700 focus:bg-white focus:border-primary focus:ring-0 transition-all placeholder-slate-400"
                placeholder="Search leads by name or interest..." type="text" />
        </div>
        <button
            (click)="openCreateLeadModal()"
            class="bg-primary text-white text-sm font-semibold px-5 py-2.5 rounded-full flex items-center gap-2 hover:bg-primary-hover transition-all shadow-glow">
            <span class="material-symbols-outlined text-lg">person_add</span>
            New Lead
        </button>
    </div>
</header>

@if (showCreateLeadModal()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-lg">
        <div class="sticky top-0 flex items-center justify-between border-b border-slate-100 bg-white px-6 py-4">
            <h2 class="text-lg font-bold text-slate-900">Create New Lead</h2>
            <button
                (click)="closeCreateLeadModal()"
                class="text-slate-500 hover:text-slate-700"
                aria-label="Close create lead modal">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>
        <div class="p-6">
            <app-create-lead
                [asModal]="true"
                (closed)="closeCreateLeadModal()"
                (saved)="onLeadSaved()">
            </app-create-lead>
        </div>
    </div>
</div>
}
