<main class="flex-1 relative flex overflow-hidden">

    <!-- Right panel: Map area -->
    <div class="flex-1 relative bg-sidebar-bg">

        <!-- Map Background -->
        <div id="map" class="absolute inset-0 map-bg"></div>

        <!-- Map Controls -->
        <div class="absolute top-6 right-6 flex flex-col gap-4 z-40">
            <div class="flex bg-white/10 backdrop-blur-md p-1 rounded-xl border border-white/10 shadow-premium">
                <button
                    class="px-4 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all">Map
                    View</button>
                <button
                    class="px-4 py-2 text-xs font-bold rounded-lg text-white hover:bg-white/5 transition-all">Satellite</button>
            </div>
            <div
                class="flex flex-col bg-white/10 backdrop-blur-md rounded-xl border border-white/10 shadow-premium overflow-hidden">
                <button class="p-3 text-white hover:bg-white/10 transition-colors border-b border-white/10">
                    <span class="material-symbols-outlined">add</span>
                </button>
                <button class="p-3 text-white hover:bg-white/10 transition-colors">
                    <span class="material-symbols-outlined">remove</span>
                </button>
            </div>
            <button
                class="p-3 bg-white/10 backdrop-blur-md rounded-xl border border-white/10 shadow-premium text-white hover:bg-white/10 transition-colors">
                <span class="material-symbols-outlined">my_location</span>
            </button>
        </div>

        <!-- (Add your pin blocks here, like the Palm Jumeirah Villa example) -->
