<section class="mx-auto w-full max-w-5xl rounded-2xl border border-slate-100 bg-white p-6 shadow-soft">
  <div class="mb-6 flex flex-col gap-1">
    <h2 class="text-2xl font-bold text-slate-900">Create New Property</h2>
    <p class="text-sm text-slate-500">Add a new listing with all required details.</p>
  </div>

  <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
    <label class="flex flex-col gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">Name *</span>
      <input [(ngModel)]="property.name" name="name" type="text" class="rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-primary" placeholder="Palm Jumeirah Villa" />
    </label>

    <label class="flex flex-col gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">Property Image *</span>
      <input type="file" accept="image/*" (change)="onImagePicked($event)" class="rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition file:mr-4 file:rounded-md file:border-0 file:bg-slate-100 file:px-3 file:py-1.5 file:text-xs file:font-semibold file:text-slate-700 hover:file:bg-slate-200" />
    </label>

    <label class="flex flex-col gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">State *</span>
      <select [(ngModel)]="property.state" name="state" class="rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-primary">
        <option value="" disabled>Select state</option>
        @for (state of stateOptions; track state) {
          <option [value]="state">{{ state }}</option>
        }
      </select>
    </label>

    <label class="flex flex-col gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">Price *</span>
      <input [(ngModel)]="property.price" name="price" type="number" class="rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-primary" placeholder="15000000" />
    </label>

    <div class="md:col-span-2 rounded-xl border border-dashed border-slate-200 bg-slate-50 p-3">
      @if (imagePreviewUrl) {
        <img [src]="imagePreviewUrl" alt="Property preview" class="h-52 w-full rounded-lg object-cover" />
      } @else {
        <div class="flex h-40 items-center justify-center rounded-lg bg-white text-sm font-medium text-slate-400">Image preview will appear here</div>
      }
    </div>

    <label class="flex flex-col gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">Status *</span>
      <select [(ngModel)]="property.status" name="status" class="rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-primary">
        <option value="" disabled>Select status</option>
        @for (status of statusOptions; track status) {
          <option [value]="status">{{ status }}</option>
        }
      </select>
    </label>

    <label class="flex flex-col gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">Max Bed Count *</span>
      <input [(ngModel)]="property.maxBedCount" name="maxBedCount" type="number" class="rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-primary" placeholder="6" />
    </label>

    <label class="flex flex-col gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">Min Bed Count *</span>
      <input [(ngModel)]="property.minBedCount" name="minBedCount" type="number" class="rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-primary" placeholder="3" />
    </label>

    <label class="flex flex-col gap-2 md:col-span-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">Area (sqft) *</span>
      <input [(ngModel)]="property.sqft" name="sqft" type="number" class="rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-primary" placeholder="4200" />
    </label>

    <label class="flex flex-col gap-2 md:col-span-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-600">Description *</span>
      <div class="relative">
        <textarea [(ngModel)]="property.dsc" name="dsc" rows="5" class="w-full rounded-lg border border-slate-200 px-3 py-2 pr-12 text-sm outline-none transition focus:border-primary" placeholder="Write a short property description..."></textarea>
        <button
            type="button"
            (click)="generateDescription()"
            [disabled]="isGenerating"
            title="Generate with AI"
            aria-label="Generate description with AI"
            class="absolute right-2 top-2 inline-flex h-8 w-8 items-center justify-center rounded-md border transition disabled:cursor-not-allowed disabled:opacity-50"
            [class.border-primary/25]="!isGenerating"
            [class.bg-primary/10]="!isGenerating"
            [class.text-primary]="!isGenerating"
            [class.hover:bg-primary/15]="!isGenerating"
            [class.border-slate-300]="isGenerating"
            [class.bg-slate-100]="isGenerating"
            [class.text-slate-400]="isGenerating"
          >
            @if (isGenerating) {
              <span class="material-symbols-outlined text-base animate-spin">autorenew</span>
            } @else {
              <span class="material-symbols-outlined text-base">auto_awesome</span>
            }
          </button>
      </div>
    </label>

    <div class="md:col-span-2 mt-2 flex flex-wrap gap-3">
      <button type="button" (click)="submit()" class="rounded-lg bg-primary px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-hover">Create Property</button>
      <button type="button" (click)="cancel()" class="rounded-lg border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">Cancel</button>
    </div>

    @if (formErrorMessage) {
      <p class="md:col-span-2 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
        {{ formErrorMessage }}
      </p>
    }
  </div>
</section>
