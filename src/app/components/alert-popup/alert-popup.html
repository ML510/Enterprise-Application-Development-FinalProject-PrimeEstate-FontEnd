<div class="relative inline-flex">
  <button
    type="button"
    class="relative flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-sm transition-colors hover:border-slate-300 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400/40"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="panelId"
    (click)="toggle()"
  >
    <span class="material-symbols-outlined text-[22px]">notifications</span>
    @if (unreadCount() > 0) {
      <span class="absolute right-1.5 top-1.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-semibold leading-none text-white">
        {{ unreadCount() }}
      </span>
    }
  </button>

  @if (isOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 cursor-default bg-slate-950/10"
      aria-label="Close alerts popup"
      (click)="close()"
    ></button>

    <section
      [id]="panelId"
      role="dialog"
      aria-label="Notifications"
      class="absolute right-0 top-full z-50 mt-3 w-[22rem] overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl"
    >
      <header class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
        <div>
          <p class="text-sm font-semibold text-slate-900">Alerts</p>
          <p class="text-xs text-slate-500">
            {{ unreadCount() }} unread update{{ unreadCount() === 1 ? '' : 's' }}
          </p>
        </div>

        <button
          type="button"
          class="text-xs font-semibold text-slate-600 transition-colors hover:text-slate-900 disabled:cursor-not-allowed disabled:text-slate-400"
          [disabled]="unreadCount() === 0"
          (click)="markAllAsRead()"
        >
          Mark all as read
        </button>
      </header>

      <div class="max-h-80 divide-y divide-slate-100 overflow-y-auto">
        @for (alert of alerts(); track trackByAlertId($index, alert)) {
          <button
            type="button"
            class="flex w-full gap-3 px-5 py-4 text-left transition-colors hover:bg-slate-50"
            (click)="markAsRead(alert.id)"
          >
            <span
              class="mt-1 h-2.5 w-2.5 rounded-full"
              [class.bg-sky-500]="alert.level === 'info' && !alert.read"
              [class.bg-emerald-500]="alert.level === 'success' && !alert.read"
              [class.bg-amber-500]="alert.level === 'warning' && !alert.read"
              [class.bg-slate-300]="alert.read"
            ></span>

            <span class="min-w-0 flex-1">
              <span class="flex items-center justify-between gap-3">
                <span class="truncate text-sm font-semibold text-slate-900">{{ alert.title }}</span>
                <span class="shrink-0 text-xs text-slate-500">{{ alert.time }}</span>
              </span>
              <span class="mt-1 block text-sm leading-6 text-slate-600">{{ alert.message }}</span>
            </span>
          </button>
        }
      </div>

      <footer class="border-t border-slate-100 px-5 py-4">
        <p class="text-xs text-slate-500">
          Tap an alert to mark it read and keep the top bar clear.
        </p>
      </footer>
    </section>
  }
</div>
