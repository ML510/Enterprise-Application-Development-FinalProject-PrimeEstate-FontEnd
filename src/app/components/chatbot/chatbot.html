<div class="fixed bottom-24 right-8 z-50 pointer-events-auto">
    <div
        class=" pointer-events-auto cursor-default w-95 bg-white rounded-3xl chat-shadow overflow-hidden border border-slate-100 dark:border-slate-800 mb-4 transform transition-all duration-300 origin-bottom-right translate-y-0 opacity-100 flex flex-col h-130">
        <div class="bg-primary p-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center border border-white/30 backdrop-blur-sm">
                    <span class="material-symbols-outlined text-white">smart_toy</span>
                </div>
                <div>
                    <h3 class="text-white font-bold text-sm">PrimeAI Concierge</h3>
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-green-400"></span>
                        <span class="text-white/80 text-[10px] uppercase font-bold tracking-wider">Online</span>
                    </div>
                </div>
            </div>
            <button class="text-white/80 hover:text-white transition-colors" (click)="close.emit()">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>
        </div>
        <div #messagesContainer class="flex-1 p-6 overflow-y-auto space-y-4">
            @for (message of messages; track $index) {
                @if (message.role === 'assistant') {
                    <div class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-primary text-sm">smart_toy</span>
                        </div>
                        <div class="bg-slate-50  p-4 rounded-2xl rounded-tl-none border border-slate-100">
                            <p class="text-slate-700 text-sm leading-relaxed">{{ message.text }}</p>
                        </div>
                    </div>
                } @else {
                    <div class="flex justify-end">
                        <div class="max-w-[80%] bg-primary text-white p-4 rounded-2xl rounded-tr-none border border-primary/30">
                            <p class="text-sm leading-relaxed">{{ message.text }}</p>
                        </div>
                    </div>
                }
            }

            <div class="flex flex-wrap gap-2 pl-11">
                <button
                    class="px-4 py-2 rounded-full border border-primary/20 text-primary text-xs font-bold bg-primary/5 hover:bg-primary hover:text-white transition-all">View
                    Off-Plan</button>
                <button
                    class="px-4 py-2 rounded-full border border-primary/20 text-primary text-xs font-bold bg-primary/5 hover:bg-primary hover:text-white transition-all">Book
                    a Viewing</button>
                <button
                    class="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-xs font-bold bg-white hover:border-primary transition-all">Market
                    Insights</button>
            </div>
        </div>
        <div class="p-4 bg-white  border-t border-slate-100">
            <div class="relative flex items-center">
                <input
                    class="w-full bg-slate-50 border-0 focus:ring-1 focus:ring-primary/20 rounded-2xl pl-4 pr-12 py-3 text-sm text-slate-700"
                    placeholder="Type your message..." type="text" [(ngModel)]="text"
                    (keydown.enter)="sendMessage()" />
                <button (click)="sendMessage()"
                    class="absolute right-2 w-8 h-8 bg-primary rounded-xl flex items-center justify-center text-white hover:bg-primary-dark transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
                    [disabled]="loading || !text.trim()">
                    @if (loading) {
                        <span class="material-symbols-outlined text-sm animate-spin">progress_activity</span>
                    } @else {
                        <span class="material-symbols-outlined text-sm">send</span>
                    }
                </button>
            </div>
            <p class="text-[10px] text-slate-400 text-center mt-3">Powered by PrimeState AI Technology</p>
        </div>
    </div>
</div>
